[package]
name = "gamerzz"
version = "1.0.0"
description = "A local library for your PC game collection."
authors = ["George Marantos"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gamerzz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` lets the webview load cover images straight from the app
# data folder instead of shuttling every image over IPC.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls rather than the platform TLS stack: one less native dependency to get
# wrong when this is built on Windows.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
